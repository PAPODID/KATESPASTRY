<!DOCTYPE html>
<html lang="fr">
<!--
=============================================
INDEX.HTML - Page d'Accueil et Chargement
=============================================

OBJECTIF: Page d'entrée avec animation de chargement avant redirection
UTILISATION: Point d'entrée principal de l'application KATE'S PASTRY
FONCTIONNEMENT: Affiche un écran de chargement animé puis redirige vers homepage.html

FONCTIONNALITÉS:
- Animation de chargement avec spinner et fade-in
- Redirection automatique après 2 secondes
- Design responsive avec dégradé de couleurs boulangerie
- Intégration du système d'injection de métadonnées

POINTS D'ATTENTION:
- Délai de redirection fixé à 2000ms
- Styles CSS intégrés pour éviter les dépendances
- Script externe Rocket.new (peut être supprimé si non utilisé)
- Chemin relatif vers homepage.html

TODO: Vérifier l'utilité du script Rocket.new
NOTE: Page critique pour la première impression utilisateur
-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KATE'S PASTRY - Boulangerie artisanale à Lomé, produits frais et traditionnels" />
  <title>KATE'S PASTRY - Boulangerie Artisanale</title>
  <link rel="stylesheet" href="../css/main.css" />
  <!-- ===== STYLES INTÉGRÉS POUR L'ÉCRAN DE CHARGEMENT ===== -->
  <style>
    /* Reset et configuration de base */
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #8B4513, #D2691E); /* Dégradé brun boulangerie */
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    /* Conteneur principal de chargement */
    .loading-container {
        text-align: center;
        animation: fadeIn 0.8s ease-in;                        /* Animation d'apparition */
    }

    /* Logo de la boulangerie */
    .bakery-logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);              /* Ombre pour lisibilité */
    }

    /* Texte de bienvenue */
    .loading-text {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        opacity: 0.9;
    }

    /* Spinner de chargement animé */
    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);               /* Bordure transparente */
        border-top: 4px solid white;                           /* Bordure supérieure visible */
        border-radius: 50%;
        animation: spin 1s linear infinite;                     /* Rotation continue */
        margin: 0 auto;
    }

    /* Animation de rotation du spinner */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Animation d'apparition en fondu */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }       /* Démarre invisible et décalé */
        to { opacity: 1; transform: translateY(0); }            /* Termine visible et centré */
    }
  </style>
  <script type="module" src="../static.rocket.new/rocket-webce9a.js?_cfg=https%3A%2F%2Fartisanba4267back.builtwithrocket.new&amp;_be=https%3A%2F%2Fapplication.rocket.new&amp;_v=0.1.6"></script>
</head>
<body>
  <!-- ===== ÉCRAN DE CHARGEMENT ANIMÉ ===== -->
  <div class="loading-container">
    <div class="bakery-logo">🥖 KATE'S PASTRY 🥐</div>
    <div class="loading-text">Bienvenue dans notre univers artisanal...</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- ===== SCRIPT DE REDIRECTION AUTOMATIQUE ===== -->
  <script>
    // Redirige vers la page d'accueil après l'animation de chargement
    // DÉLAI: 2000ms pour laisser le temps à l'animation de se jouer
    setTimeout(function() {
        console.log('🏠 Redirection vers homepage.html');
        window.location.href = 'pages/homepage.html';
    }, 2000);
  </script>
  
  <!-- ===== SYSTÈME D'INJECTION DE MÉTADONNÉES ===== -->
  <!-- Charge le script d'injection d'attributs DOM pour le tagging -->
  <script id="dhws-dataInjector" src="dhws-data-injector.js"></script>
</body>

<!-- 
===== FIN INDEX.HTML =====
Page d'entrée KATE'S PASTRY - Animation de chargement et redirection automatique
-->
</html>
